map $host $adalia_https_host {
    default adaliagame.ru;
    test.adaliagame.ru test.adaliagame.ru;
}

server {
    listen 80;
    listen [::]:80;
    server_name adaliagame.ru www.adaliagame.ru test.adaliagame.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/adalia-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$adalia_https_host$request_uri;
    }
}
