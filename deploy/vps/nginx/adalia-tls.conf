map $http_upgrade $adalia_connection_upgrade {
    default upgrade;
    '' close;
}

map $host $adalia_hsts {
    default "";
    adaliagame.ru "max-age=63072000; includeSubDomains; preload";
    www.adaliagame.ru "max-age=63072000; includeSubDomains; preload";
}

map $request_method $adalia_preflight_max_age {
    default "";
    OPTIONS 86400;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adaliagame.ru www.adaliagame.ru;

    ssl_certificate /etc/letsencrypt/live/adaliagame.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adaliagame.ru/privkey.pem;
    root /var/www/adalia-production/current;
    include /etc/nginx/snippets/adalia-site.conf;

    location ^~ /api/ {
        include /etc/nginx/snippets/adalia-proxy.conf;
        include /etc/nginx/snippets/adalia-headers.conf;
        proxy_pass http://127.0.0.1:7001;

        # The backend also emits CORS headers. Keep one copy of the edge policy.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;
        add_header Access-Control-Allow-Origin "https://adaliagame.ru" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE, PATCH, HEAD" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-CSRFToken, Accept, Origin, Access-Control-Request-Method, Access-Control-Request-Headers" always;
        add_header Access-Control-Max-Age $adalia_preflight_max_age always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.adaliagame.ru;

    ssl_certificate /etc/letsencrypt/live/test.adaliagame.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.adaliagame.ru/privkey.pem;
    root /var/www/adalia-test/current;
    include /etc/nginx/snippets/adalia-site.conf;

    location ^~ /api/ {
        include /etc/nginx/snippets/adalia-proxy.conf;
        proxy_pass http://127.0.0.1:7001;
    }

    location = /navyi {
        return 308 /navyi/;
    }

    location ^~ /navyi/ {
        include /etc/nginx/snippets/adalia-proxy.conf;
        include /etc/nginx/snippets/adalia-headers.conf;
        client_max_body_size 64k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:7003;
        add_header Cache-Control "no-store" always;
    }
}
