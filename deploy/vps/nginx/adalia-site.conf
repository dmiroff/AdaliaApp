ssl_protocols TLSv1.2 TLSv1.3;
index index.html;
include /etc/nginx/snippets/adalia-headers.conf;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/javascript application/json text/css text/plain;

proxy_connect_timeout 30s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;

location ~ (^|/)\. {
    return 404;
}

location ~* (?:^|/)(?:README\.md|package\.json|composer\.json|web\.config)$ {
    return 404;
}

# Only build files with versioned names get the long cache lifetime.
location ~ ^/static/ {
    expires 1y;
    try_files $uri =404;
}

location ~* \.(?:css|js|map|avif|jpg|jpeg|gif|png|svg|webp|ico|woff2?|ttf|eot|json|pdf|txt|webmanifest)$ {
    expires -1;
    try_files $uri =404;
}

location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}
